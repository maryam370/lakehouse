apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shop-db-data
  namespace: source
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-db
  namespace: source
spec:
  replicas: 1
  strategy: 
    type: Recreate
  selector:
    matchLabels:
      app: shop-db
  template:
    metadata:
      labels:
        app: shop-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          args: ["-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
          env:
            - name: POSTGRES_USER
              value: shop
            - name: POSTGRES_PASSWORD
              value: shop123
            - name: POSTGRES_DB
              value: shop
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata  
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shop-db-data
--- 
apiVersion: v1
kind: Service
metadata:
  name: shop-db
  namespace: source
spec:
  selector:
    app: shop-db
  ports:
    - port: 5432
