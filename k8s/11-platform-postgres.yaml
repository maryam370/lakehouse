apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-db-init
  namespace: lakehouse
data:
  init.sql: |
    CREATE DATABASE iceberg_catalog;
    CREATE DATABASE airflow;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-db-data
  namespace: lakehouse
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-db
  namespace: lakehouse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: platform-db
  template:
    metadata:
      labels:
        app: platform-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: PG_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: PG_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-db-data
        - name: init
          configMap:
            name: platform-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: platform-db
  namespace: lakehouse
spec:
  selector:
    app: platform-db
  ports:
    - port: 5432