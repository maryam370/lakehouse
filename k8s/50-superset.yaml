apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config
  namespace: serving
data:
  superset_config.py: |
    import os
    SECRET_KEY = os.environ['SUPERSET_SECRET_KEY']
    SQLALCHEMY_DATABASE_URI = (
        'postgresql+psycopg2://%s:%s@platform-db.lakehouse.svc.cluster.local:5432/superset'
        % (os.environ['PG_USER'], os.environ['PG_PASSWORD'])
    )
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      enableServiceLinks: false
      containers:
        - name: superset
          image: superset-lh:7.0.0
          imagePullPolicy: Never
          command: ["/bin/bash", "-c"]
          args:
            - |
              . /app/.venv/bin/activate
              superset db upgrade
              superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true
              superset init
              exec /app/docker/entrypoints/run-server.sh
          env:
            - name: SUPERSET_SECRET_KEY
              value: change-me-to-any-long-random-text-1234567890
            - name: SUPERSET_CONFIG_PATH
              value: /app/pythonpath/superset_config.py
            - name: SERVER_WORKER_AMOUNT
              value: "2"
          envFrom:
            - secretRef:
                name: platform-db
          ports:
            - containerPort: 8088
          resources:
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/pythonpath/superset_config.py
              subPath: superset_config.py
      volumes:
        - name: config
          configMap:
            name: superset-config
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: serving
spec:
  selector:
    app: superset
  ports:
    - port: 8088