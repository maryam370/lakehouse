apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: lakehouse
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
--- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: lakehouse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
      metadata:
        labels:
          app: seaweedfs
      spec:
        containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.55
          args: ["server", "-dir=/data", "-s3", "master.volumeSizeLimitMB=1024"]
          envFrom:
            - secretRef:
                name: s3-credentials
          ports:
            - containerPort: 8333
            - containerPort: 9333
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 8333
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9333
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: seaweedfs-data        
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: lakehouse
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
    - name: master-ui
      port: 9333
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-buckets
  namespace: lakehouse
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: aws-cli
        image: amazon/aws-cli:2.42.3
        envFrom:
          - secretRef:
              name: s3-credentials
        env:
          - name: AWS_DEFAULT_REGION
            value: us-east-1
        command: ["/bin/sh", "-c"]
        args:
          - |
            E=http://seaweedfs.lakehouse.svc.cluster.local:8333

            until aws --endpoint-url $E s3 ls; do
              echo "waiting for storage"
              sleep 5
            done

            for b in warehouse checkpoints landing; do
              aws --endpoint-url $E s3 mb s3://$b || true
            done

            aws --endpoint-url $E s3 ls
